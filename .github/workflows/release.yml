name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/doorframe
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Resolve publish version
        id: version
        run: |
          PACKAGE_NAME="$(node -p "require('./apps/cli/package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./apps/cli/package.json').version")"
          ROOT_VERSION="$(node -p "require('./package.json').version")"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $PACKAGE_NAME package version $PACKAGE_VERSION" >&2
              exit 1
            fi
            RELEASE_KIND="tag"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            VERSION="$PACKAGE_VERSION"
            RELEASE_KIND="main"
          else
            echo "This workflow only publishes from main or v*.*.* tags. Current ref: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [ "$ROOT_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::warning::Root package version $ROOT_VERSION does not match $PACKAGE_NAME package version $PACKAGE_VERSION."
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_kind=$RELEASE_KIND" >> "$GITHUB_OUTPUT"

      - name: Check npm package version
        id: npm_version
        run: |
          PACKAGE_SPEC="${{ steps.version.outputs.package_name }}@${{ steps.version.outputs.version }}"
          PUBLISHED_VERSION="$(npm view "$PACKAGE_SPEC" version 2>/dev/null || true)"

          if [ -n "$PUBLISHED_VERSION" ]; then
            PUBLISHED_GIT_HEAD="$(npm view "$PACKAGE_SPEC" gitHead 2>/dev/null || true)"
            if [ "$PUBLISHED_GIT_HEAD" = "$GITHUB_SHA" ]; then
              echo "::notice::$PACKAGE_SPEC is already published from this commit; skipping npm publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "version_tag=true" >> "$GITHUB_OUTPUT"
            elif [ "${{ steps.version.outputs.release_kind }}" = "tag" ]; then
              echo "::error::$PACKAGE_SPEC already exists on npm with gitHead '$PUBLISHED_GIT_HEAD'. Move this tag to the published commit or bump apps/cli/package.json before creating a GitHub Release."
              exit 1
            else
              echo "::warning::$PACKAGE_SPEC already exists on npm with gitHead '$PUBLISHED_GIT_HEAD'. Skipping npm publish; bump apps/cli/package.json in a PR that should publish a new npm package version."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "version_tag=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build -w apps/web

      - name: Build CLI package
        run: npm run build -w apps/cli

      - name: npm pack dry run
        run: npm pack --dry-run -w apps/cli

      - name: Generate release artifacts
        if: ${{ steps.version.outputs.release_kind == 'tag' }}
        run: npm run release:assets

      - name: Create npm tarball artifact
        if: ${{ steps.version.outputs.release_kind == 'tag' }}
        run: npm pack -w apps/cli --pack-destination release-artifacts

      - name: Ensure npm supports publishing auth
        if: ${{ steps.npm_version.outputs.publish == 'true' }}
        run: npm install -g npm@^11.5.1

      - name: Publish npm package
        if: ${{ steps.npm_version.outputs.publish == 'true' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::add-mask::$NPM_TOKEN"
            echo "Publishing npm package with the NPM_TOKEN repository secret."
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish -w apps/cli --access public --tag latest
          else
            echo "Publishing npm package with npm Trusted Publishing."
            npm publish -w apps/cli --access public --tag latest
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.npm_version.outputs.version_tag == 'true' }}
            type=ref,event=branch
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          labels: |
            org.opencontainers.image.title=Doorframe
            org.opencontainers.image.description=Local-first requirements traceability web app
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}

      - name: Create GitHub Release
        if: ${{ steps.version.outputs.release_kind == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/doorframe-falcon-traceability-report.html \
            release-artifacts/doorframe-falcon-baseline-diff.html \
            release-artifacts/checksums.txt \
            release-artifacts/*.tgz \
            --title "Doorframe $GITHUB_REF_NAME" \
            --notes-file release-artifacts/release-notes.md \
            --verify-tag
