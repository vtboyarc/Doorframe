name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/doorframe
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Validate tag matches package version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build CLI package
        run: npm run build -w apps/cli

      - name: Build web app
        run: npm run build -w apps/web

      - name: npm pack dry run
        run: npm pack --dry-run -w apps/cli

      - name: Generate release artifacts
        run: npm run release:assets

      - name: Create npm tarball artifact
        run: npm pack -w apps/cli --pack-destination release-artifacts

      - name: Ensure npm supports trusted publishing
        if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
        run: npm install -g npm@^11.5.1

      - name: Publish npm package
        if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w apps/cli --access public

      - name: Skip npm publish
        if: ${{ vars.NPM_PUBLISH_ENABLED != 'true' }}
        run: echo "Skipping npm publish. Set repository variable NPM_PUBLISH_ENABLED=true after npm Trusted Publishing is configured and the release workflow is reviewed."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Doorframe
            org.opencontainers.image.description=Local-first requirements traceability web app
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/doorframe-falcon-traceability-report.html \
            release-artifacts/doorframe-falcon-baseline-diff.html \
            release-artifacts/checksums.txt \
            release-artifacts/*.tgz \
            --title "Doorframe $GITHUB_REF_NAME" \
            --notes-file release-artifacts/release-notes.md \
            --verify-tag
